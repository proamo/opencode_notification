services:
  broker:
    build:
      context: .
      dockerfile: container/broker.Dockerfile
    image: opencode-telegram-broker:local
    container_name: opencode-telegram-broker
    restart: unless-stopped
    ports:
      - "127.0.0.1:42617:42617"
    volumes:
      - ${OPENCODE_TELEGRAM_HOST_STATE_DIR:-opencode-telegram-state}:/state
      - /etc/localtime:/etc/localtime:ro
    environment:
      - OPENCODE_TELEGRAM_CONTAINER=1
      - OPENCODE_TELEGRAM_BOT_TOKEN_FILE=/state/telegram-bot-token
      - OPENCODE_TELEGRAM_BROKER_STATE_DIR=/state
      - TZ=${TZ:-Asia/Taipei}
    command: ["start"]

volumes:
  opencode-telegram-state:
