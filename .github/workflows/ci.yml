name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Bun ${{ matrix.bun }} / OpenCode plugin ${{ matrix.opencode-plugin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - bun: 1.3.0
            opencode-plugin: 1.18.0
          - bun: 1.3.14
            opencode-plugin: 1.18.18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - run: bun add --no-save --exact @opencode-ai/plugin@${{ matrix.opencode-plugin }}
      - run: bun run check
      - run: bun test
      - run: bun run build

  openspec:
    name: OpenSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes @fission-ai/openspec@1.8.0 validate --all --strict
