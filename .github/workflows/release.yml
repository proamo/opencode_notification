name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node for npm provenance
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release artifact
        run: bun run release:check

      - name: Determine dist-tag and publish
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          DIST_TAG="latest"
          if [ "${{ github.event.release.prerelease }}" = "true" ] || grep -q '"version": ".*-.*"' package.json; then
            DIST_TAG="next"
          fi
          echo "Publishing to npm with --tag ${DIST_TAG}"
          npm publish --provenance --access public --tag ${DIST_TAG}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
